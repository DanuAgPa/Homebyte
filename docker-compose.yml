services:
  traefik:
    image: traefik:v3.0
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-console.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  minio-create-bucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc config host add myminio http://minio:9000 admin password123;
      /usr/bin/mc mb myminio/erp-bucket || true;
      /usr/bin/mc policy set public myminio/erp-bucket || true;
      exit 0;
      "
    networks:
      - app-network

  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
    depends_on:
      - minio
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextjs-app.rule=Host(`localhost`) || Host(`app.localhost`)"
      - "traefik.http.routers.nextjs-app.entrypoints=web"
      - "traefik.http.services.nextjs-app.loadbalancer.server.port=3000"
    # Note: We scale this from CLI: docker-compose up -d --scale nextjs-app=3

  crm-service:
    build:
      context: ./services/crm
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL_CRM}
      - MINIO_ENDPOINT=minio
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crm-service.rule=Host(`crm.localhost`)"
      - "traefik.http.routers.crm-service.entrypoints=web"
      - "traefik.http.services.crm-service.loadbalancer.server.port=3001"

  hr-service:
    build:
      context: ./services/hr
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL_HR}
      - MINIO_ENDPOINT=minio
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hr-service.rule=Host(`hr.localhost`)"
      - "traefik.http.routers.hr-service.entrypoints=web"
      - "traefik.http.services.hr-service.loadbalancer.server.port=3002"

volumes:
  minio_data:

networks:
  app-network:
    driver: bridge
